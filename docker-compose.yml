name: show-da-biblia

services:
  db:
    image: postgres:16-alpine
    container_name: show-da-biblia-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - '5432:5432'
    volumes:
      - show_da_biblia_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - show-da-biblia

  atlas-db:
    image: postgres:16-alpine
    container_name: show-da-biblia-atlas-db
    environment:
      POSTGRES_DB: dev
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    volumes:
      - show_da_biblia_atlas_postgres_data:/var/lib/postgresql/data
    networks:
      - show-da-biblia

  atlas:
    build:
      context: .
      dockerfile: ./infra/atlas/dev/Dockerfile
    container_name: show-da-biblia-atlas
    user: '1000:1000'
    env_file:
      - .env
    environment:
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    depends_on:
      - db
      - atlas-db
    volumes:
      - ./:/app
    networks:
      - show-da-biblia

  minio:
    image: minio/minio:latest
    container_name: show-da-biblia-minio
    command: server /data --console-address ":9001"
    environment:
      TZ: America/Sao_Paulo
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - '9002:9000'
      - '9003:9001'
    volumes:
      - show_da_biblia_minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - show-da-biblia

  minio-setup:
    image: minio/mc:latest
    container_name: show-da-biblia-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    environment:
      TZ: America/Sao_Paulo
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY &&
      mc mb -p local/$$S3_BUCKET || true &&
      mc anonymous set download local/$$S3_BUCKET &&
      mc admin info local
      "
    networks:
      - show-da-biblia
    restart: 'no'

  manager_api:
    build:
      context: .
      dockerfile: apps/manager_api/Dockerfile
    container_name: show-da-biblia-manager-api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      API_PORT: 3000
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-http://localhost:9002}
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - show-da-biblia

networks:
  show-da-biblia:
    name: show-da-biblia

volumes:
  show_da_biblia_postgres_data:
  show_da_biblia_atlas_postgres_data:
  show_da_biblia_minio_data:
